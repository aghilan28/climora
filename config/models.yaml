selection_criterion:
  primary: "test_rmse"
  tie_breaker: "test_mae"

xgboost:
  n_estimators: 300
  learning_rate: 0.03
  max_depth: 5
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 30

lightgbm:
  n_estimators: 300
  learning_rate: 0.03
  max_depth: 5
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 30

lstm:
  sequence_length: 24
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  patience: 15
  seed: 42

isolation_forest:
  contamination: 0.05
  n_estimators: 100
  random_state: 42
  sensitivity_levels: [0.01, 0.05, 0.10]
