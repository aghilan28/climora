dataset:
  name: "NASA GISS GISTEMP v4 Global Monthly Temperature Anomaly"
  primary_key: "date"
  target_col: "anomaly_c"
  temporal_frequency: "MS" # Month Start
  baseline_period: "1951-1980"
  split:
    train_start: "1880-01-01"
    train_end: "1999-12-01"
    val_start: "2000-01-01"
    val_end: "2014-12-01"
    test_start: "2015-01-01"
    test_end: "2025-12-01"
  partial_years_excluded: [2026]

